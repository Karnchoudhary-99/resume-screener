[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screener"
version = "0.1.0"
description = "AI resume screening: parse, score and rank candidates against a job description"
requires-python = ">=3.10"

[project.scripts]
resume-screener = "resume_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
